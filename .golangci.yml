version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
  exclusions:
    generated: lax
    paths:
      - .*\.gen\.go$
      - .*_generated\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.gen\.go$
      - .*_generated\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
